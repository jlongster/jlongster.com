<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Flipper</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#fcfbf9] p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-gray-900">Animation Flipper</h1>

    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-900">Import Animation Data</h2>
      <input
        type="file"
        id="fileInput"
        accept=".json"
        class="block w-full text-sm text-gray-900
          file:mr-4 file:py-2 file:px-4
          file:rounded file:border-0
          file:text-sm file:font-semibold
          file:bg-blue-600 file:text-white
          hover:file:bg-blue-700
          cursor-pointer"
      />
    </div>

    <div id="animationInfo" class="bg-white rounded-lg shadow p-6 mb-6" style="display: none;">
      <h2 class="text-xl font-semibold mb-4 text-gray-900">Animation Info</h2>
      <p class="text-gray-700 mb-2">
        <strong>File:</strong> <span id="fileName"></span>
      </p>
      <p class="text-gray-700 mb-2">
        <strong>Keyframes:</strong> <span id="keyframeCount"></span>
      </p>
      <p class="text-gray-700 mb-4">
        <strong>FPS:</strong> <span id="fps"></span>
      </p>
      <p id="flippedStatus" class="text-gray-700 mb-4" style="display: none;">
        <strong class="text-green-600">✓ Animation has been flipped</strong>
      </p>

      <button
        id="flipBtn"
        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition mr-4"
      >
        Flip Animation
      </button>

      <button
        id="exportBtn"
        class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition"
      >
        Export Flipped Data
      </button>
    </div>

    <div id="previewSection" class="bg-white rounded-lg shadow p-6" style="display: none;">
      <h2 class="text-xl font-semibold mb-4 text-gray-900">Preview (First Keyframe)</h2>
      <pre id="preview" class="bg-gray-100 p-4 rounded text-xs overflow-auto max-h-96 text-gray-900"></pre>
    </div>
  </div>

  <script>
    let animationData = null;
    let originalFileName = '';

    const fileInput = document.getElementById('fileInput');
    const animationInfo = document.getElementById('animationInfo');
    const previewSection = document.getElementById('previewSection');
    const fileNameSpan = document.getElementById('fileName');
    const keyframeCountSpan = document.getElementById('keyframeCount');
    const fpsSpan = document.getElementById('fps');
    const previewPre = document.getElementById('preview');
    const flipBtn = document.getElementById('flipBtn');
    const exportBtn = document.getElementById('exportBtn');

    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      originalFileName = file.name;
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          animationData = JSON.parse(e.target.result);
          console.log('Loaded animation data:', animationData);

          // Update UI
          fileNameSpan.textContent = originalFileName;
          keyframeCountSpan.textContent = animationData.keyframes?.filter(k => k).length || 0;
          fpsSpan.textContent = animationData.playbackFPS || 'N/A';

          const firstKeyframe = animationData.keyframes?.[0] || animationData.keyframes?.find(k => k);
          previewPre.textContent = JSON.stringify(firstKeyframe, null, 2);

          animationInfo.style.display = 'block';
          previewSection.style.display = 'block';
        } catch (error) {
          console.error('Failed to parse JSON:', error);
          alert('Invalid JSON file');
        }
      };

      reader.readAsText(file);
    });

    flipBtn.addEventListener('click', function() {
      if (!animationData) return;

      console.log('Before flip:', JSON.parse(JSON.stringify(animationData.keyframes[0])));

      // Process each keyframe
      if (animationData.keyframes) {
        animationData.keyframes = animationData.keyframes.map(keyframe => {
          if (!keyframe) return keyframe;

          // Swap leftCurve and rightCurve
          const tempLeft = keyframe.leftCurve;
          const tempRight = keyframe.rightCurve;

          return {
            ...keyframe,
            leftCurve: tempRight ? [...tempRight].reverse() : tempRight,
            rightCurve: tempLeft ? [...tempLeft].reverse() : tempLeft,
          };
        });
      }

      console.log('After flip:', animationData.keyframes[0]);

      // Update preview
      const firstKeyframe = animationData.keyframes?.[0] || animationData.keyframes?.find(k => k);
      previewPre.textContent = JSON.stringify(firstKeyframe, null, 2);

      // Show flipped status
      document.getElementById('flippedStatus').style.display = 'block';

      console.log('Animation flipped');
    });

    exportBtn.addEventListener('click', function() {
      if (!animationData) return;

      const dataStr = JSON.stringify(animationData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = originalFileName.replace('.json', '-flipped.json');
      link.click();
      URL.revokeObjectURL(url);

      console.log('Animation exported');
    });
  </script>
</body>
</html>
